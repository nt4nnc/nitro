<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Layout List & Leaderboards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Full-screen stretched background */
    body {
      background-image: url('background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    /* Fixed container behind content for floating soggies */
    #soggy-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      overflow: hidden;
      z-index: -1;
    }

    .soggy-img {
      position: absolute;
      width: 126px;
      height: auto;
      animation: floatAndRotate linear infinite;
    }

    @keyframes floatAndRotate {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(var(--move-x), var(--move-y)) rotate(360deg); }
    }

    /* Level Cards: Transparent background & white text */
    #list-container .card {
      background-color: rgba(33, 37, 41, 0.2) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.15) !important;
      backdrop-filter: blur(4px);
    }

    #list-container .card * {
      color: #ffffff !important;
    }

    /* Leaderboard Container: Light Translucent BG & Black Text */
    #leaderboard-container {
      background-color: rgba(255, 255, 255, 0.85) !important;
      border-radius: 8px;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    #leaderboard-container, 
    #leaderboard-container table, 
    #leaderboard-container th, 
    #leaderboard-container td, 
    #leaderboard-container * {
      color: #000000 !important;
    }

    /* View Records Popup / Modal Fixes */
    .modal-content {
      background-color: #ffffff !important;
      border-radius: 10px;
      border: none;
    }

    .modal-header, .modal-body, .modal-footer {
      background-color: #ffffff !important;
    }

    /* Force all text inside modal to pure black */
    .modal-content,
    .modal-content *,
    .modal-content h1,
    .modal-content h2,
    .modal-content h3,
    .modal-content h4,
    .modal-content h5,
    .modal-content p,
    .modal-content div,
    .modal-content li,
    .modal-content span,
    .modal-content strong {
      color: #000000 !important;
    }

    /* Fix bootstrap list items in modal */
    .modal-content .list-group-item {
      background-color: #f8f9fa !important;
      border-color: #dee2e6 !important;
    }

    /* Keep Modal Close Button Visible */
    .modal-content .btn-close {
      filter: none !important;
      opacity: 0.8;
    }
  </style>
</head>
<body class="text-white">

  <!-- Background layer for flying soggies -->
  <div id="soggy-container"></div>

  <div class="container my-4">
    <h1 class="text-center mb-4">GD Layout List</h1>
    <div id="list-container"></div>

    <hr class="my-5">

    <h2 class="text-center mb-4">Player Leaderboards</h2>
    <div id="leaderboard-container"></div>
  </div>

  <!-- Bootstrap 5 JavaScript Bundle (Crucial for closing modals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script loading list.js -->
  <script src="js/list.js"></script>

  <!-- Script to spawn floating soggy images -->
  <script>
    function spawnSoggy() {
      const container = document.getElementById('soggy-container');
      const img = document.createElement('img');
      img.src = 'soggy.jpg';
      img.classList.add('soggy-img');

      const startX = Math.random() * window.innerWidth;
      const startY = Math.random() * window.innerHeight;
      img.style.left = `${startX}px`;
      img.style.top = `${startY}px`;

      const opacity = (Math.random() * (0.70 - 0.20) + 0.20).toFixed(2);
      img.style.opacity = opacity;

      const moveX = (Math.random() - 0.5) * 1200 + 'px';
      const moveY = (Math.random() - 0.5) * 1200 + 'px';
      img.style.setProperty('--move-x', moveX);
      img.style.setProperty('--move-y', moveY);

      const duration = Math.random() * 8 + 6;
      img.style.animationDuration = `${duration}s`;

      container.appendChild(img);
    }

    for (let i = 0; i < 20; i++) {
      spawnSoggy();
    }
  </script>
</body>
</html>
